; Host reference-workload CPU budget. See docs/CPU_TIMING_PROFILE.md.
; Measured from original x86, not instruction-exact for every scenario.
; Does not change PIT clock, sound pitch, or original movement arithmetic.
; Allowed: 100..100000. User-approved playable speed, 2026-10-18.
; 2500 gives about one-third the old 10000 update rate in the reference replay.
; The port workload estimate is not an exact DOSBox-X cycle conversion.
cpu_cycles_per_ms=2500
; The launcher defaults to this port's assets/original-game installation.
; Override with -GameDirectory or MECHWARRIOR_ASSET_DIRECTORY if needed.
; Campaign music device: speaker, mt32 or adlib. Combat currently retains native
; PC-speaker effects; its separate intelligent-mode Roland driver is not ported.
sound_system=speaker
; MT-32 requires a compatible, legally supplied CONTROL and PCM ROM pair.
; Paths may be absolute or relative to this INI. No ROMs ship with the port.
mt32_control_rom=
mt32_pcm_rom=
