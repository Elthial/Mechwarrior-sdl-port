name: windows playable build
on:
  push:
    branches: [main, develop, 'ci/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      label:
        type: string
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 535d80badefc83c5c527ec5748f2a20d6a9310fe # SDL 3.2.0
          path: dependencies/SDL
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CMake
        run: python -m pip install cmake==3.31.6
      - name: Build and verify extracted runtime package
        env:
          PACKAGE_LABEL: ${{ inputs.label || github.sha }}
        run: python tools/build_package.py --sdl dependencies/SDL --label "$PACKAGE_LABEL"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256
